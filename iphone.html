<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta name="theme-color" content="#ffffff">
    <title>CineArena.Fun</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #f8fafc;
            --bg-gradient: linear-gradient(to bottom, #ffffff 0%, #f1f5f9 100%);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(0, 0, 0, 0.08);
            --glass-blur: blur(20px);
            --glass-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
            --accent-primary: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.2);
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.05) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        .stream-header {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 0.75rem 1.5rem;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            box-shadow: var(--glass-shadow);
            flex-wrap: nowrap;
            gap: 1rem;
        }

        .stream-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(to right, #0f172a, #475569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
        }

        .live-badge {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px var(--danger-glow);
            letter-spacing: 1px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .live-badge i { font-size: 0.6rem; animation: pulseRed 2s infinite; }
        
        @keyframes pulseRed {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        #player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            z-index: 10;
        }

        .grid-panels {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            margin-top: 1.5rem;
            margin-bottom: 0;
        }

        .info-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: var(--glass-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.12);
        }

        .info-card h2 {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: var(--accent-gradient);
            color: white;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
        }

        .telegram-popup {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,0,0,0.1);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            z-index: 10000;
            text-align: center;
            width: 90%; max-width: 400px;
            display: none;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .telegram-popup h2 { 
            color: #1e293b; 
            font-size: 1.5rem; 
            margin-bottom: 0.5rem; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .telegram-popup .fa-telegram { color: #2AABEE; }
        
        .telegram-popup p { 
            color: #64748b; 
            font-size: 0.95rem; 
            margin-bottom: 1.5rem; 
            line-height: 1.6;
        }

        .telegram-popup .popup-button {
            width: 100%;
            padding: 1rem;
            margin-top: 0.75rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }

        .telegram-popup .join-btn {
            background: #2AABEE;
            color: white;
            box-shadow: 0 4px 15px rgba(42, 171, 238, 0.3);
            border: none;
        }
        
        .telegram-popup .join-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(42, 171, 238, 0.4); }

        .telegram-popup .joined-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid rgba(0,0,0,0.1);
        }
        
        .telegram-popup .joined-btn:hover { background: rgba(0,0,0,0.05); color: var(--text-primary); }

        .error-message {
            background: #fff;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .error-message h2 { color: #dc2626; margin-bottom: 1rem; }

        .counter-container {
            margin-top: 2rem;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            display: inline-block;
            width: auto;
            border: 1px solid var(--glass-border);
            font-size: 0.8rem;
        }
        .bottom-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        @media (max-width: 600px) {
            body { padding: 1rem 0.5rem; }
            .stream-header { padding: 0.6rem 1rem; gap: 0.8rem; }
            .stream-header h1 { font-size: 1rem; white-space: nowrap; }
            .live-badge { padding: 0.3rem 0.75rem; font-size: 0.7rem; }
            .grid-panels { grid-template-columns: 1fr; gap: 1rem; margin-bottom: 0; }
            .telegram-popup { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <main class="container">
        <div id="stream-content">
            <div style="height: 400px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary);">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
            </div>
        </div>
    </main>

    <div class="telegram-popup" id="telegramPopup">
        <h2 id="popup-title"><i class="fa-brands fa-telegram"></i> Join The Action</h2>
        <p>Get instant updates, match highlights, and exclusive links on our official channel.</p>
        <a href="https://t.me/+-veA6xX6J6UxOGFl" target="_blank" rel="noopener noreferrer" class="popup-button join-btn">Join Channel Now</a>
        <button class="popup-button joined-btn" onclick="document.getElementById('telegramPopup').style.display='none';">I've Already Joined</button>
    </div>

    <script>
        async function initializeApp() {
            try {
                const response = await fetch('https://cineiframe.cinearena08.workers.dev/');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();

                const urlParams = new URLSearchParams(window.location.search);
                const streamId = urlParams.get('id');
                const streamData = data.iframes.find(item => item.id === streamId);

                if (streamData) {
                    document.title = `${streamData.name} // Live Stream`;
                    renderIframeUI(streamData);
                    setTimeout(() => { 
                        const popup = document.getElementById('telegramPopup');
                        if (popup) popup.style.display = 'block';
                    }, 2000);
                } else {
                    renderErrorUI("Stream Not Found", "The requested stream ID is invalid, or the stream is currently offline.");
                }

            } catch (error) {
                console.error("Failed to fetch streams:", error);
                renderErrorUI("Connection Failed", "Could not load stream configuration. Please check your internet connection.");
            }
        }

        function renderIframeUI(data) {
            const contentDiv = document.getElementById('stream-content');
            contentDiv.innerHTML = `
                <div class="stream-header">
                    <h1>${escapeHtml(data.name)}</h1>
                    <span class="live-badge"><i class="fa-solid fa-circle"></i> LIVE NOW</span>
                </div>

                <div id="player-container">
                    <iframe 
                        src="${data.iframeSrc}" 
                        style="width:100%; height:100%; border:0;" 
                        allow="encrypted-media; autoplay; fullscreen" 
                        allowfullscreen>
                    </iframe>
                </div>

                
            `;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function renderErrorUI(title, message) {
            const contentDiv = document.getElementById('stream-content');
            document.title = `Error - ${title}`;
            contentDiv.innerHTML = `
                <div class="error-message">
                    <h2><i class="fa-solid fa-triangle-exclamation"></i> ${escapeHtml(title)}</h2>
                    <p>${escapeHtml(message)}</p>
                </div>
            `;
        }
        
        document.addEventListener("DOMContentLoaded", () => {
            initializeApp();
        });
    </script>

    <div class="bottom-wrapper">
        <div class="counter-container">
            <script src="//widget.supercounters.com/ssl/online_t.js"></script>
            <script>sc_online_t(1707487,"Users Online","170ddb");</script>
            <noscript><a href="https://www.supercounters.com/">supercounters.com</a></noscript>
        </div>
    </div>
</body>
</html>
