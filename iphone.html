<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <meta name="referrer" content="no-referrer"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Player Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe 
      id="streamFrame"
      src="" 
      allow="autoplay; fullscreen; picture-in-picture; accelerometer; gyroscope; clipboard-write; encrypted-media"
      allowfullscreen
      webkitallowfullscreen
      mozallowfullscreen
      frameborder="0"
      scrolling="no"
      referrerpolicy="no-referrer"
      webkit-playsinline
      playsinline
    ></iframe>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // STREAM URL - YAHAN APNA URL DALEIN
      const STREAM_URL = "https://demo-6yx.pages.dev/playernew?id=hindi";
      
      const iframe = document.getElementById('streamFrame');
      
      // Set iframe src
      iframe.src = STREAM_URL;
      
      // iOS-specific fixes
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        // Force reload for iOS
        setTimeout(() => {
          iframe.src = iframe.src;
        }, 100);
        
        // iOS 15+ fix for fullscreen
        iframe.addEventListener('webkitbeginfullscreen', () => {
          iframe.style.width = '100%';
          iframe.style.height = '100%';
        });
        
        iframe.addEventListener('webkitendfullscreen', () => {
          iframe.style.width = '100%';
          iframe.style.height = '100%';
        });
      }
      
      // Handle orientation change
      window.addEventListener('orientationchange', function() {
        setTimeout(() => {
          iframe.style.height = window.innerHeight + 'px';
        }, 100);
      });
      
      // Auto-resize on window resize
      window.addEventListener('resize', function() {
        iframe.style.height = window.innerHeight + 'px';
      });
    });
  </script>
</body>
</html>
