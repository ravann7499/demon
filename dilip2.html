<script>
(() => {
"use strict";

/* ============================================================
   CRICKCAST CONFIG
   Same API/M3U source as the supplied player.
   ============================================================ */
const API = "https://sayan-jio-tv.pages.dev/playlist.m3u";

/* Automatically refresh channel data every 5 minutes. */
const AUTO_REFRESH_MS = 5 * 60 * 1000;

const $ = id => document.getElementById(id);
const overlay = $("overlay");
const loadMsg = $("loadMsg");
const list = $("channel-list");
const grid = $("grid");
const gridWrap = $("gridWrap");
const categories = $("categories");
const count = $("count");
const searchInput = $("searchInput");
const clearSearch = $("clearSearch");
const empty = $("empty");
const playerBox = $("player");
const video = $("video");
const watermark = $("watermark");
const topWatermark = $("topWatermark");
const status = $("status");
const backBtn = $("backBtn");

let allChannels = [];
let activeCategory = "All";
let query = "";
let shakaPlayer = null;
let currentChannel = null;
let refreshTimer = null;
let statusTimer = null;
let refreshingStream = false;

/* ---------- UI ---------- */
function toast(message, type="ok", duration=3500) {
  status.textContent = message;
  status.className = "show " + type;
  clearTimeout(statusTimer);
  if(duration !== 0) {
    statusTimer = setTimeout(() => status.className = "", duration);
  }
}

function showPopup() {
  const popup = document.getElementById("popup");
  popup.classList.add("show");
}

function closePopup() {
  const popup = document.getElementById("popup");
  popup.classList.remove("show");
}

/* Make functions globally accessible for onclick handlers */
window.showPopup = showPopup;
window.closePopup = closePopup;

function setLoading(message) {
  loadMsg.textContent = message;
}

function hideOverlay() {
  overlay.style.display = "none";
}

/* ---------- M3U parser ---------- */
function parseM3U(text) {
  const lines = text.split(/\r?\n/);
  const channels = [];

  for(let i=0;i<lines.length;i++) {
    const line = lines[i].trim();
    if(!line || line.startsWith("#EXTM3U")) continue;
    if(!line.startsWith("#EXTINF:")) continue;

    const attr = (name) => {
      const re = new RegExp(name + '="([^"]*)"');
      const m = line.match(re);
      return m ? m[1].trim() : "";
    };

    const nameMatch = line.match(/,(.*)$/);
    const name = nameMatch ? nameMatch[1].trim() : (attr("tvg-name") || "Unknown");

    const ch = {
      id: attr("tvg-id") || "ch_" + (channels.length + 1),
      name,
      logo: attr("tvg-logo"),
      group: attr("group-title") || "General",
      language: attr("tvg-language"),
      key_id: "",
      key: "",
      stream_url: "",
      cookie: "",
      user_agent: ""
    };

    let j = i + 1;

    /* KODIPROP */
    while(j < lines.length && lines[j].trim().startsWith("#KODIPROP:")) {
      const p = lines[j].trim().match(/#KODIPROP:([^=]+)=(.+)/);
      if(p) {
        const key = p[1].trim();
        const value = p[2].trim();

        if(key === "inputstream.adaptive.license_key" &&
           value.includes(":") && !value.startsWith("{")) {
          const parts = value.split(":");
          ch.key_id = parts[0].trim();
          ch.key = parts.slice(1).join(":").trim();
        }

        if(key === "inputstream.adaptive.stream_headers") {
          const cm = value.match(/Cookie=([^;]+)/i);
          if(cm) ch.cookie = cm[1].trim();

          const hm = value.match(/__hdnea__=[^;&]+/i);
          if(hm && !ch.cookie) ch.cookie = hm[0];
        }
      }
      j++;
    }

    /* EXTVLCOPT */
    while(j < lines.length && lines[j].trim().startsWith("#EXTVLCOPT:")) {
      const p = lines[j].trim().match(/#EXTVLCOPT:([^=]+)=(.+)/);
      if(p && p[1].trim() === "http-user-agent") {
        ch.user_agent = p[2].trim();
      }
      j++;
    }

    /* EXTHTTP */
    while(j < lines.length && lines[j].trim().startsWith("#EXTHTTP:")) {
      const p = lines[j].trim().match(/#EXTHTTP:\s*({.+})/);
      if(p) {
        try {
          const obj = JSON.parse(p[1]);
          if(obj.cookie) ch.cookie = obj.cookie;
        } catch(e) {}
      }
      j++;
    }

    const url = lines[j] ? lines[j].trim() : "";
    if(url && !url.startsWith("#")) ch.stream_url = url;

    if(ch.stream_url) channels.push(ch);
    i = Math.max(i, j - 1);
  }

  return channels;
}

/* ---------- API ---------- */
async function fetchChannels() {
  const response = await fetch(API + (API.includes("?") ? "&" : "?") + "_=" + Date.now(), {
    cache: "no-store",
    headers: { "Accept": "application/vnd.apple.mpegurl, text/plain, */*" }
  });

  if(!response.ok) throw new Error("HTTP " + response.status);

  const text = await response.text();
  const channels = parseM3U(text);

  if(!channels.length) throw new Error("No channels found");
  return channels;
}

/* ---------- Channel list ---------- */
function renderCategories() {
  const set = new Set();
  allChannels.forEach(ch => {
    if(ch.group && ch.group !== "General") set.add(ch.group);
  });

  const cats = ["All", ...Array.from(set).sort()];
  categories.innerHTML = "";

  cats.forEach(cat => {
    const b = document.createElement("button");
    b.className = "pill" + (cat === activeCategory ? " active" : "");
    b.textContent = cat;
    b.onclick = () => {
      activeCategory = cat;
      renderCategories();
      applyFilters();
      gridWrap.scrollTop = 0;
    };
    categories.appendChild(b);
  });
}

function applyFilters() {
  let result = allChannels;

  if(activeCategory !== "All")
    result = result.filter(ch => ch.group === activeCategory);

  const q = query.trim().toLowerCase();
  if(q)
    result = result.filter(ch =>
      ch.name.toLowerCase().includes(q) ||
      ch.group.toLowerCase().includes(q)
    );

  renderChannels(result);
}

function initials(name) {
  return name.split(/\s+/).slice(0,2).map(x => x[0] || "").join("").toUpperCase();
}

function renderChannels(channels) {
  count.textContent = channels.length + " channels";

  if(!channels.length) {
    grid.style.display = "none";
    empty.style.display = "block";
    return;
  }

  grid.style.display = "grid";
  empty.style.display = "none";
  grid.innerHTML = "";

  channels.forEach(ch => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = "?id=" + encodeURIComponent(ch.id);

    const badge = ch.group && ch.group !== "General"
      ? `<span class="badge">${escapeHTML(ch.group)}</span>` : "";

    const logo = ch.logo
      ? `<img class="logo" src="${escapeAttr(ch.logo)}" alt="${escapeAttr(ch.name)}"
           loading="lazy" onerror="this.style.display='none'">`
      : `<div class="placeholder">${escapeHTML(initials(ch.name))}</div>`;

    a.innerHTML = badge + logo + `<span class="name">${escapeHTML(ch.name)}</span>`;
    grid.appendChild(a);
  });
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function escapeAttr(s) {
  return escapeHTML(s);
}

function showList() {
  playerBox.style.display = "none";
  list.style.display = "flex";
  watermark.style.display = "none";
  topWatermark.style.display = "none";
  backBtn.style.display = "none";
}

function showPlayer() {
  list.style.display = "none";
  playerBox.style.display = "flex";
  watermark.style.display = "flex";
  topWatermark.style.display = "block";
  backBtn.style.display = "block";
}

/* ---------- Device profile ---------- */
function getProfile() {
  const mem = navigator.deviceMemory || 4;
  const cores = navigator.hardwareConcurrency || 4;
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  if(!mobile) return {maxHeight:1080,maxBandwidth:0,buffer:12,estimate:2000000};
  if(mem <= 1.5 || cores <= 2)
    return {maxHeight:480,maxBandwidth:1200000,buffer:5,estimate:400000};
  if(mem <= 3 || cores <= 4)
    return {maxHeight:720,maxBandwidth:3500000,buffer:8,estimate:1000000};

  return {maxHeight:1080,maxBandwidth:0,buffer:12,estimate:2000000};
}

const PROFILE = getProfile();

/* ---------- Player ---------- */
function rawCookie(cookie) {
  if(!cookie) return "";
  return cookie.startsWith("__hdnea__=") ? cookie.slice(10) : cookie;
}

function appendCookie(url, raw) {
  if(!url || !raw || url.includes("__hdnea__")) return url;
  return url + (url.includes("?") ? "&" : "?") + "__hdnea__=" + raw;
}

async function destroyPlayer() {
  if(shakaPlayer) {
    try { await shakaPlayer.destroy(); } catch(e) {}
    shakaPlayer = null;
  }
  video.removeAttribute("src");
  video.load();
}

async function startPlayer(ch) {
  currentChannel = ch;
  showPlayer();
  toast("Loading " + ch.name + "…", "warn", 0);

  if(!shaka.Player.isBrowserSupported()) {
    toast("Browser not supported", "err", 0);
    return;
  }

  await destroyPlayer();

  shaka.polyfill.installAll();
  shakaPlayer = new shaka.Player();
  await shakaPlayer.attach(video);

  new shaka.ui.Overlay(shakaPlayer, playerBox, video).configure({
    controlPanelElements:[
      "play_pause","mute","volume","time_and_duration",
      "spacer","quality","fullscreen"
    ],
    seekBarColors:{
      base:"#777",
      buffered:"#7f1d1d",
      played:"#ff3030"
    }
  });

  const cookie = ch.cookie || "";
  const raw = rawCookie(cookie);

  const config = {
    manifest:{
      defaultPresentationDelay:4,
      ignoreTextStreamFailures:true,
      retryParameters:{
        maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000
      }
    },
    streaming:{
      lowLatencyMode:false,
      bufferingGoal:PROFILE.buffer,
      rebufferingGoal:1.5,
      bufferBehind:30,
      safeSeekOffset:4,
      stallEnabled:true,
      stallThreshold:1,
      stallSkip:.3,
      retryParameters:{
        maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000
      }
    },
    abr:{
      enabled:true,
      defaultBandwidthEstimate:PROFILE.estimate,
      switchInterval:4,
      restrictions:{
        maxHeight:PROFILE.maxHeight,
        ...(PROFILE.maxBandwidth ? {maxBandwidth:PROFILE.maxBandwidth} : {})
      }
    }
  };

  if(ch.key_id && ch.key)
    config.drm = {clearKeys:{[ch.key_id]:ch.key}};

  shakaPlayer.configure(config);

  const T = shaka.net.NetworkingEngine.RequestType;

  shakaPlayer.getNetworkingEngine().registerRequestFilter((type, req) => {
    req.headers["Referer"] = "https://www.jiotv.com/";
    req.headers["Origin"] = "https://www.jiotv.com";
    req.headers["User-Agent"] =
      ch.user_agent ||
      "Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/124.0.0.0 Mobile Safari/537.36";

    if(cookie) req.headers["Cookie"] = cookie;

    if(type === T.MANIFEST || type === T.SEGMENT) {
      req.uris = req.uris.map(u => appendCookie(u, raw));
    }
  });

  try {
    await shakaPlayer.load(ch.stream_url);
    video.play().catch(() => {});
    toast("● LIVE", "ok", 3000);
  } catch(error) {
    console.error(error);
    toast("Stream failed — retrying…", "err", 0);
    setTimeout(() => reloadCurrentChannel(), 1500);
  }

  video.addEventListener("waiting", handleWaiting);
  video.addEventListener("stalled", handleWaiting);
  video.addEventListener("playing", () => toast("● LIVE", "ok", 2500), {once:false});

  shakaPlayer.addEventListener("error", e => {
    console.warn("Shaka error:", e.detail);
    if(!refreshingStream) setTimeout(() => reloadCurrentChannel(), 1000);
  });
}

let stallTimer = null;

function handleWaiting() {
  if(stallTimer || refreshingStream) return;
  toast("Buffering…", "warn", 0);

  stallTimer = setTimeout(async () => {
    stallTimer = null;

    try {
      if(shakaPlayer) {
        shakaPlayer.goToLive();
        await new Promise(r => setTimeout(r, 1200));
        if(!video.paused) {
          toast("● LIVE", "ok", 2500);
          return;
        }
      }
    } catch(e) {}

    reloadCurrentChannel();
  }, 5000);
}

async function reloadCurrentChannel() {
  if(!currentChannel || refreshingStream) return;

  refreshingStream = true;
  toast("Refreshing stream…", "warn", 0);

  try {
    const freshChannels = await fetchChannels();
    const fresh = freshChannels.find(c => c.id === currentChannel.id);

    if(!fresh) throw new Error("Channel no longer exists");

    allChannels = freshChannels;
    currentChannel = fresh;

    await startPlayer(fresh);
  } catch(e) {
    console.error(e);
    toast("Unable to refresh stream", "err", 3500);
  } finally {
    refreshingStream = false;
  }
}

/* ---------- Automatic channel update ---------- */
async function refreshChannelData(silent=true) {
  try {
    const oldIds = new Set(allChannels.map(c => c.id));
    const fresh = await fetchChannels();

    allChannels = fresh;

    renderCategories();
    applyFilters();

    const changed = fresh.length !== oldIds.size ||
      fresh.some(c => !oldIds.has(c.id));

    if(!silent && changed) toast("Channel list updated", "ok", 3000);

    /* If a channel is playing, pick up fresh URL/cookie/key data. */
    if(currentChannel) {
      const updated = fresh.find(c => c.id === currentChannel.id);
      if(updated) currentChannel = updated;
    }
  } catch(e) {
    console.warn("Auto-refresh failed:", e);
    if(!silent) toast("Channel update failed", "err", 3000);
  }
}

function startAutoRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(() => refreshChannelData(true), AUTO_REFRESH_MS);
}

/* ---------- Search ---------- */
searchInput.addEventListener("input", () => {
  query = searchInput.value;
  clearSearch.classList.toggle("show", !!query);
  applyFilters();
});

clearSearch.onclick = () => {
  searchInput.value = "";
  query = "";
  clearSearch.classList.remove("show");
  applyFilters();
  searchInput.focus();
};

searchInput.addEventListener("keydown", e => {
  if(e.key === "Escape") clearSearch.click();
});

/* ---------- Navigation ---------- */
backBtn.onclick = async () => {
  currentChannel = null;
  await destroyPlayer();
  showList();
};

window.addEventListener("popstate", () => {
  const id = new URLSearchParams(location.search).get("id");
  if(id) {
    const ch = allChannels.find(c => c.id === id);
    if(ch) startPlayer(ch);
  } else {
    currentChannel = null;
    destroyPlayer();
    showList();
  }
});

/* ---------- Main ---------- */
async function main() {
  /* Setup popup event listeners */
  const popupCloseBtn = document.getElementById("popupCloseBtn");
  const popupJoinBtn = document.getElementById("popupJoinBtn");
  if(popupCloseBtn) popupCloseBtn.addEventListener("click", closePopup);
  if(popupJoinBtn) popupJoinBtn.addEventListener("click", () => {
    window.open("https://t.me/+AreyM6apVFAzZDk9", "_blank");
    closePopup();
  });

  try {
    setLoading("Fetching STREAMXCRICK channels…");
    allChannels = await fetchChannels();

    renderCategories();
    applyFilters();
    hideOverlay();
    startAutoRefresh();

    const id = new URLSearchParams(location.search).get("id");

    if(id) {
      const ch = allChannels.find(c => c.id === id);
      if(ch) await startPlayer(ch);
      else showList();
    } else {
      showList();
    }

    /* Refresh when the page becomes visible again. */
    document.addEventListener("visibilitychange", () => {
      if(!document.hidden) refreshChannelData(true);
    });

    /* Show popup after 3 seconds */
    setTimeout(() => showPopup(), 3000);

  } catch(e) {
    console.error(e);
    setLoading("Unable to load channels: " + e.message);
    toast("Channel API error", "err", 0);
  }
}

document.addEventListener("DOMContentLoaded", main);

})();
</script>
